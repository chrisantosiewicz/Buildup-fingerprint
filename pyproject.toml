[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildup"
version = "0.0.1"
description = "Build-up value and the Build-Up Fingerprint: every passing option valued in goals, from SkillCorner events and tracking"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "optuna>=3.0",
    "pyarrow>=12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
app = ["streamlit>=1.30", "plotly>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
